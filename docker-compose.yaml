services:
  syncer:
    build: .
    restart: unless-stopped 
    environment:
      DB_PATH: ${DB_PATH}
      SONGS_PATH: /app/songs
      SECRETS_PATH: ${SECRETS_PATH}
      WORKER_COUNT: ${WORKER_COUNT}
      ASSETS_PATH: ${ASSETS_PATH}
      SLEEP_SEC: ${SLEEP_SEC}
      SHEETS_PATH: ${SHEETS_PATH}
    volumes:
      - type: bind
        source: ${DATA}
        target: /app/data
      - type: bind
        source: ${SONGS_PATH}
        target: /app/songs
